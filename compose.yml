name: rudiapi

x-rudiapi-build: &rudiapi-build
  context: .
  dockerfile: dockerfile

x-rudiapi-env: &rudiapi-env
  DATABASE_URL: postgresql://rudiapi:rudiapi@postgres:5432/rudiapi
  DEPLOY: ${DEPLOY:-False}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  REDIS_SECRET_KEY: rudiapi
  REDIS_URL: redis://redis:6379
  SECRET_KEY: ${SECRET_KEY:?}
  SKIP_SEEDERS: ${SKIP_SEEDERS:-False}

x-rudiapi-healthcheck: &rudiapi-healthcheck
  interval: 5s
  retries: 10
  start_period: 5s
  test:
    - CMD
    - python
    - -c
    - import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health/')
  timeout: 5s

services:
  postgres:
    environment:
      POSTGRES_DB: rudiapi
      POSTGRES_PASSWORD: rudiapi
      POSTGRES_USER: rudiapi
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rudiapi -d rudiapi"]
      timeout: 5s
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    command: ["redis-server", "--requirepass", "rudiapi", "--save", ""]
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD", "redis-cli", "-a", "rudiapi", "ping"]
      timeout: 5s
    image: redis:8
    ports:
      - "6379:6379"

  migrate:
    build:
      <<: *rudiapi-build
      target: runtime-prod
    command: ["python", "src/manage.py", "migrate", "--no-input"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *rudiapi-env
      DEBUG: "False"
    image: rudiapi:prod
    profiles: ["dev", "prod"]
    restart: "no"

  rudiapi-dev:
    build:
      <<: *rudiapi-build
      target: runtime-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rudiapi-env
      DEBUG: ${DEBUG:-True}
    healthcheck: *rudiapi-healthcheck
    image: rudiapi:dev
    ports:
      - "8080:8080"
    profiles: ["dev"]
    volumes:
      - ./src:/app/src

  rudiapi-prod:
    build:
      <<: *rudiapi-build
      target: runtime-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rudiapi-env
      DEBUG: "False"
    healthcheck: *rudiapi-healthcheck
    image: rudiapi:prod
    ports:
      - "8080:8080"
    profiles: ["prod"]

volumes:
  pgdata:
